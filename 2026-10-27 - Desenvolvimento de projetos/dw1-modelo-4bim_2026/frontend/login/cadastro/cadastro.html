<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="cadastro.css">
</head>

<body>

    <!-- Container Master centralizado -->
    <div class="master-container">

        <!-- Frame do cadastro -->
        <div id="cadastroFrame" class="form-container cadastro">
            <h2>Cadastro</h2>

            <label for="nome">Nome completo</label>
            <input type="text" id="nome" placeholder="Digite seu nome completo" maxlength="60" required />

            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" placeholder="Escolha um nome de usuário" maxlength="30" required />

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail" maxlength="75" required />

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" required />

            <label for="dataNascimento">Data de nascimento</label>
            <input type="date" id="dataNascimento" required />

            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric" required />

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Mínimo de 6 caracteres" maxlength="50" required />

            <button onclick="cadastrar()">Cadastrar</button>

            <p class="link-login">Já tem conta? <a href="login.html">Entrar</a></p>
        </div>

        <!-- Mensagens dinâmicas -->
        <div id="mensagem" class="message-container"></div>

    </div>

    <script src="./cadastro.js"></script>
</body>

</html>
